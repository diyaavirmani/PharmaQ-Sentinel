[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmaq-sentinel-backend"
version = "0.1.0"
description = "FastAPI backend foundation for PharmaQ Sentinel."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.31",
  "pymysql>=1.1.1",
  "alembic>=1.13.2",
  "cryptography>=43.0.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "langgraph>=0.2.60",
  "openai>=1.57.0",
  "PyMuPDF>=1.24.10",
  "python-docx>=1.1.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.2",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.6.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "mysql: tests that require a safe MySQL test database and never fall back to SQLite"
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
  "UP046",
  "UP047"
]
